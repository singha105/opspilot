apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
  annotations:
    owner-team: team-orders
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
      annotations:
        owner-team: team-orders
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: opspilot-demo-svc:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: orders-api
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: shopfront-settings, key: LOG_LEVEL}
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef: {name: shopfront-settings, key: REDIS_URL}
            - name: PAYMENTS_URL
              valueFrom:
                configMapKeyRef: {name: shopfront-settings, key: PAYMENTS_URL}
            - name: REQUIRED_ENV
              value: REDIS_URL,PAYMENTS_URL
            - name: DEPENDENCIES
              value: payments=$(PAYMENTS_URL),redis=$(REDIS_URL)
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi, cpu: 200m}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  labels:
    app.kubernetes.io/name: orders-api
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: http

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, type-check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Validate knowledge base
        run: uv run python scripts/validate_kb.py

      - name: Fixture integrity (every scenario has a current recording)
        run: uv run opspilot faults check-fixtures

      - name: Unit tests
        run: uv run pytest -m "not integration and not e2e" --cov --cov-report=term

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: data/models
          key: models-bge-small-en-v1.5-v1

      - name: Retrieval smoke eval (Chroma, 15 queries)
        run: |
          uv run opspilot eval check-queries
          uv run opspilot kb ingest --store chroma --chunker markdown_section
          uv run opspilot eval retrieval --configs smoke

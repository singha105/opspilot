id: bad-rollout-config-payments
title: payments-api rolled out a revision with an invalid LOG_LEVEL
split: test
category: BAD_ROLLOUT
namespace: shop
target: {kind: Deployment, name: payments-api, container: app}
inject:
  - type: set_env
    env: {LOG_LEVEL: VERBOSE}
expected_symptom:
  pod_reason_any_of: [CrashLoopBackOff, Error]
  timeout_s: 120
alert:
  name: KubePodCrashLooping
  severity: critical
  summary: "payments-api pods are restarting repeatedly in namespace shop"
  labels: {deployment: payments-api, namespace: shop}
expected:
  root_cause_category: BAD_ROLLOUT
  component: payments-api
  runbook_ids: [rb-bad-rollout]
  acceptable_actions: [rollback_deployment]
reset: {type: reapply_base}

name: opspilot

services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.8
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "8090:8080"
      - "50052:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      # We bring our own vectors (fastembed), so no vectorizer modules are loaded.
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      API_BASED_MODULES_DISABLED: "true"
      CLUSTER_HOSTNAME: node1
      QUERY_DEFAULTS_LIMIT: "25"
      LIMIT_RESOURCES: "true"
      GOMEMLIMIT: 600MiB
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate_data:/var/lib/weaviate
    mem_limit: 700m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    profiles: ["tracing"]
    ports:
      - "6006:6006"
      - "4317:4317"
    mem_limit: 512m
    restart: unless-stopped

  # `docker compose --profile app up -d --build` (or `make app-up`): API and console in
  # containers, replay mode. Ollama stays on the host.
  api:
    profiles: ["app"]
    build: {context: .., dockerfile: Dockerfile}
    image: opspilot-app:dev
    command: ["opspilot-api"]
    environment:
      OPSPILOT_API_TOKEN: ${OPSPILOT_API_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../runs:/app/runs
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      weaviate: {condition: service_healthy}
    mem_limit: 1500m

  ui:
    profiles: ["app"]
    image: opspilot-app:dev
    command: ["streamlit", "run", "src/opspilot/ui/app.py", "--server.address=0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ../runs:/app/runs
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: {condition: service_started}
    mem_limit: 1500m

volumes:
  weaviate_data:

id: init-wait-payments
title: payments-api init container waits for a service that does not exist
split: test
category: INIT_CONTAINER_FAILURE
namespace: shop
target: {kind: Deployment, name: payments-api, container: app}
inject:
  - type: add_init_container
    name: wait-for-ledger
    args: [wait-for, 'ledger-db:5432', --timeout, '20']
expected_symptom:
  pod_reason_any_of: [Error, CrashLoopBackOff]
  timeout_s: 150
alert:
  name: KubePodNotReady
  severity: warning
  summary: "payments-api pod has been in a non-ready state for more than 5 minutes in namespace shop"
  labels: {deployment: payments-api, namespace: shop}
expected:
  root_cause_category: INIT_CONTAINER_FAILURE
  component: payments-api
  runbook_ids: [rb-init-container-failure]
  acceptable_actions: [rollback_deployment, manual_change]
reset: {type: reapply_base}

[project]
name = "opspilot"
version = "0.4.0"
description = "AI incident-response agent for Kubernetes: LangGraph, MCP, hybrid RAG, fault-injection evals"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Arnab Singh", email = "singha105@udayton.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.8.1",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "kubernetes>=36.0.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=1.30.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "weaviate-client>=4.23.1",
]

[project.scripts]
opspilot = "opspilot.cli:app"
opspilot-k8s = "opspilot.mcp_servers.k8s_readonly.__main__:main"
opspilot-kb = "opspilot.mcp_servers.knowledge.__main__:main"
opspilot-actions = "opspilot.mcp_servers.actions.__main__:main"

[project.optional-dependencies]
pinecone = [
    "pinecone>=10.0.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]
tracing = [
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-langchain>=0.1.78",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "demo/app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"demo/app/tests/**" = ["S", "T20"]
"scripts/**" = ["T20"]
# Output fields mirror Kubernetes' camelCase JSON (restartCount, lastState, ...) on purpose.
"src/opspilot/mcp_servers/k8s_readonly/models.py" = ["N815"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/opspilot"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kubernetes.*", "flashrank.*", "rank_bm25.*", "chromadb.*", "pinecone.*"]
ignore_missing_imports = true

# Optional `tracing` group: CI type-checks without it installed.
[[tool.mypy.overrides]]
module = ["phoenix.*", "openinference.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "demo/app/tests"]
pythonpath = ["demo/app", "tests/unit"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: needs the k3d cluster, Docker or other local services",
    "e2e: full end-to-end run (cluster + LLM)",
]

[tool.coverage.run]
source = ["src/opspilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

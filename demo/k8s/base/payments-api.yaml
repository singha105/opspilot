apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
  annotations:
    owner-team: team-payments
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single replica: replace the pod in place (no surge) so a bad rollout is visible
  # immediately and the namespace never needs memory for a second copy.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
      annotations:
        owner-team: team-payments
    spec:
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: opspilot-demo-svc:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: payments-api
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: shopfront-settings, key: LOG_LEVEL}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi, cpu: 200m}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  labels:
    app.kubernetes.io/name: payments-api
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: 8080
      targetPort: http

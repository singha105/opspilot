id: nodeselector-payments
title: payments-api nodeSelector matches no node
split: test
category: SCHEDULING_CONSTRAINT
namespace: shop
target: {kind: Deployment, name: payments-api, container: app}
inject:
  - type: set_affinity
    node_selector: {disktype: ssd}
expected_symptom:
  pod_reason_any_of: [Unschedulable]
  timeout_s: 90
alert:
  name: KubeDeploymentReplicasMismatch
  severity: warning
  summary: "payments-api has 0 of 1 replicas available in namespace shop"
  labels: {deployment: payments-api, namespace: shop}
expected:
  root_cause_category: SCHEDULING_CONSTRAINT
  component: payments-api
  runbook_ids: [rb-scheduling-constraints]
  acceptable_actions: [rollback_deployment, manual_change]
reset: {type: reapply_base}

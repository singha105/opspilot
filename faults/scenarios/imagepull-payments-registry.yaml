id: imagepull-payments-registry
title: payments-api image points at a registry host that does not exist
split: test
category: IMAGE_PULL_ERROR
namespace: shop
target: {kind: Deployment, name: payments-api, container: app}
inject:
  - type: set_image
    image: "registry.shop-internal.invalid/shop/payments-api:1.4.2"
expected_symptom:
  pod_reason_any_of: [ErrImagePull, ImagePullBackOff]
  timeout_s: 120
alert:
  name: KubeDeploymentReplicasMismatch
  severity: warning
  summary: "payments-api has 0 of 1 replicas available in namespace shop"
  labels: {deployment: payments-api, namespace: shop}
expected:
  root_cause_category: IMAGE_PULL_ERROR
  component: payments-api
  runbook_ids: [rb-image-pull-error]
  acceptable_actions: [rollback_deployment, set_container_image]
reset: {type: reapply_base}

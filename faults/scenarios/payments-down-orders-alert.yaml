id: payments-down-orders-alert
title: "payments-api scaled to zero; the alert fires on its caller orders-api"
split: test
category: DEPENDENCY_UNAVAILABLE
namespace: shop
target: {kind: Deployment, name: payments-api, container: app}
inject:
  - type: scale
    replicas: 0
expected_symptom:
  not_ready_deployments: [orders-api]
  timeout_s: 120
alert:
  name: KubeDeploymentReplicasMismatch
  severity: warning
  summary: "orders-api has 0 of 1 replicas available in namespace shop"
  labels: {deployment: orders-api, namespace: shop}
expected:
  root_cause_category: DEPENDENCY_UNAVAILABLE
  component: payments-api
  runbook_ids: [rb-dependency-unavailable]
  acceptable_actions: [scale_deployment]
reset: {type: reapply_base}

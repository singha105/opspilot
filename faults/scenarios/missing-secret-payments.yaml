id: missing-secret-payments
title: payments-api reads a key from a Secret that does not exist
split: test
category: MISSING_CONFIGMAP_OR_SECRET
namespace: shop
target: {kind: Deployment, name: payments-api, container: app}
inject:
  - type: set_secret_env
    name: PAYMENTS_PROVIDER_KEY
    secret: payments-provider
    key: api-key
expected_symptom:
  pod_reason_any_of: [CreateContainerConfigError]
  timeout_s: 120
alert:
  name: KubeContainerWaiting
  severity: warning
  summary: "payments-api container has been waiting for more than 5 minutes in namespace shop"
  labels: {deployment: payments-api, namespace: shop}
expected:
  root_cause_category: MISSING_CONFIGMAP_OR_SECRET
  component: payments-api
  runbook_ids: [rb-missing-configmap-or-secret]
  acceptable_actions: [rollback_deployment, manual_change]
reset: {type: reapply_base}
